<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OxCast - Screen Share</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  video { background:#000; }
  .glow { box-shadow: 0 0 30px rgba(59,130,246,.5); }
</style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-gray-900 rounded-2xl p-6 shadow-2xl border border-gray-800">

  <!-- HOME -->
  <div id="home">
    <h1 class="text-2xl font-bold text-center mb-1">📱 OxCast</h1>
    <p class="text-gray-400 text-center text-sm mb-6">Project your mobile screen to PC</p>
    <button onclick="startShare()" class="w-full py-4 mb-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-semibold glow">
      📲 Share My Screen (Phone)
    </button>
    <button onclick="viewScreen()" class="w-full py-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-semibold">
      🖥️ View Screen (PC)
    </button>
    <p class="text-xs text-gray-500 text-center mt-6">
      On your PC, open the <b>View</b> link generated by the phone.
    </p>
  </div>

  <!-- SHARER (phone) -->
  <div id="shareView" class="hidden">
    <h2 class="text-lg font-bold mb-4">📡 Sharing Screen</h2>
    <div id="status" class="text-sm text-gray-400 mb-4">Requesting screen access…</div>
    <video id="localVideo" autoplay muted playsinline class="w-full rounded-xl mb-4"></video>
    <div id="linkBox" class="hidden mb-4">
      <label class="text-xs text-gray-400">Send this link to your PC:</label>
      <div class="flex gap-2 mt-1">
        <input id="shareLink" readonly class="flex-1 bg-gray-800 text-xs p-2 rounded-lg border border-gray-700">
        <button onclick="copyLink()" class="px-3 bg-blue-600 rounded-lg text-sm">Copy</button>
      </div>
      <a id="openLink" href="#" target="_blank" class="text-blue-400 text-xs mt-2 inline-block">Open viewer here →</a>
    </div>
    <button onclick="location.reload()" class="w-full py-3 rounded-xl bg-red-600 font-semibold">⏹ Stop Sharing</button>
  </div>

  <!-- VIEWER (PC) -->
  <div id="viewerView" class="hidden">
    <h2 class="text-lg font-bold mb-4">🖥️ Viewing Screen</h2>
    <div id="vStatus" class="text-sm text-gray-400 mb-4">Connecting…</div>
    <video id="remoteVideo" autoplay playsinline class="w-full rounded-xl mb-4 glow"></video>
    <button onclick="location.reload()" class="w-full py-3 rounded-xl bg-gray-700 font-semibold">↩ Back</button>
  </div>

</div>

<script>
const params = new URLSearchParams(location.search);
const remoteId = params.get('id');

// ---------- PC / VIEWER MODE ----------
if (remoteId) {
  document.getElementById('home').classList.add('hidden');
  document.getElementById('viewerView').classList.remove('hidden');

  const peer = new Peer(); // random id
  peer.on('open', () => {
    document.getElementById('vStatus').textContent = 'Connecting to phone…';
    const call = peer.call(remoteId, null); // receive-only call
    call.on('stream', remoteStream => {
      document.getElementById('vStatus').textContent = '✅ Connected — streaming!';
      document.getElementById('remoteVideo').srcObject = remoteStream;
    });
    call.on('close', () => document.getElementById('vStatus').textContent = '❌ Phone stopped sharing.');
  });
  peer.on('error', e => document.getElementById('vStatus').textContent = 'Error: ' + e.type);
}

// ---------- PHONE / SHARER MODE ----------
async function startShare() {
  document.getElementById('home').classList.add('hidden');
  document.getElementById('shareView').classList.remove('hidden');
  const status = document.getElementById('status');

  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 30 },
      audio: false
    });
    status.textContent = 'Screen captured ✅ — waiting for PC to connect…';
    document.getElementById('localVideo').srcObject = stream;

    const peer = new Peer(); // random id
    peer.on('open', id => {
      const url = location.origin + location.pathname + '?id=' + id;
      document.getElementById('shareLink').value = url;
      document.getElementById('openLink').href = url;
      document.getElementById('linkBox').classList.remove('hidden');

      peer.on('call', call => {
        call.answer(stream); // send screen to viewer
        status.textContent = '🔗 Connected! PC is viewing your screen.';
      });
    });
    peer.on('error', e => status.textContent = 'Error: ' + e.type);

    // stop if user ends sharing from browser UI
    stream.getVideoTracks()[0].onended = () => location.reload();

  } catch (err) {
    status.textContent = '❌ Screen access denied or unsupported (iOS Safari not supported — use Android Chrome).';
  }
}

function copyLink() {
  const input = document.getElementById('shareLink');
  navigator.clipboard.writeText(input.value);
  event.target.textContent = '✓';
  setTimeout(() => event.target.textContent = 'Copy', 1500);
}

// ---------- just open viewer without id ----------
function viewScreen() {
  alert('Open the link generated by the phone (it contains ?id=...). The phone must share first!');
}
</script>
</body>
</html>

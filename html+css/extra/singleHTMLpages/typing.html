<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <title>Typing Replay Demo</title>

      <script src="https://cdn.tailwindcss.com"></script>
   </head>

   <body
      class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6"
   >
      <div class="w-full max-w-3xl">
         <!-- Header -->
         <div class="mb-8">
            <h1 class="text-3xl font-bold">Typing Replay</h1>
            <p class="text-slate-400 mt-2">
               Type the sentence and replay your exact typing session.
            </p>
         </div>

         <!-- Test Card -->
         <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <!-- Target Text -->
            <div class="mb-6">
               <p class="text-sm text-slate-400 mb-2">Type this:</p>

               <div
                  id="targetText"
                  class="text-xl leading-8 font-mono bg-slate-950 p-5 rounded-xl"
               >
                  The quick brown fox jumps over the lazy dog
               </div>
            </div>

            <!-- Typing Area -->
            <textarea
               id="typingInput"
               disabled
               spellcheck="false"
               autocomplete="off"
               class="w-full h-32 bg-slate-950 border border-slate-700 rounded-xl p-4 font-mono text-lg outline-none focus:border-blue-500 resize-none"
               placeholder="Click Start and start typing..."
            ></textarea>

            <!-- Stats -->
            <div class="grid grid-cols-3 gap-4 mt-5">
               <div class="bg-slate-950 rounded-xl p-4">
                  <p class="text-sm text-slate-500">Time</p>
                  <p id="time" class="text-xl font-bold">0.00s</p>
               </div>

               <div class="bg-slate-950 rounded-xl p-4">
                  <p class="text-sm text-slate-500">Characters</p>
                  <p id="characters" class="text-xl font-bold">0</p>
               </div>

               <div class="bg-slate-950 rounded-xl p-4">
                  <p class="text-sm text-slate-500">Events</p>
                  <p id="eventCount" class="text-xl font-bold">0</p>
               </div>
            </div>

            <!-- Buttons -->
            <div class="flex gap-3 mt-6">
               <button
                  id="startBtn"
                  class="px-5 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-semibold transition"
               >
                  Start
               </button>

               <button
                  id="finishBtn"
                  disabled
                  class="px-5 py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 rounded-xl font-semibold transition"
               >
                  Finish
               </button>

               <button
                  id="replayBtn"
                  disabled
                  class="px-5 py-3 bg-purple-600 hover:bg-purple-500 disabled:bg-slate-700 disabled:text-slate-500 rounded-xl font-semibold transition"
               >
                  ▶ Replay
               </button>
            </div>

            <!-- Replay Output -->
            <div class="mt-8">
               <div class="flex items-center justify-between mb-2">
                  <p class="text-sm text-slate-400">Replay</p>

                  <span id="replayStatus" class="text-sm text-slate-500">
                     Not started
                  </span>
               </div>

               <div
                  id="replayOutput"
                  class="min-h-24 bg-slate-950 border border-slate-800 rounded-xl p-5 font-mono text-lg leading-8"
               ></div>
            </div>
         </div>
      </div>

      <script>
         const TARGET = "The quick brown fox jumps over the lazy dog";

         const input = document.getElementById("typingInput");
         const startBtn = document.getElementById("startBtn");
         const finishBtn = document.getElementById("finishBtn");
         const replayBtn = document.getElementById("replayBtn");

         const timeEl = document.getElementById("time");
         const charactersEl = document.getElementById("characters");
         const eventCountEl = document.getElementById("eventCount");

         const replayOutput = document.getElementById("replayOutput");
         const replayStatus = document.getElementById("replayStatus");

         /*
        |--------------------------------------------------------------------------
        | Session State
        |--------------------------------------------------------------------------
        */

         let session = {
            startedAt: null,
            finishedAt: null,
            events: [],
         };

         let timer = null;
         let isTyping = false;

         /*
        |--------------------------------------------------------------------------
        | START TEST
        |--------------------------------------------------------------------------
        */

         startBtn.addEventListener("click", () => {
            session = {
               startedAt: performance.now(),
               finishedAt: null,
               events: [],
            };

            input.value = "";

            input.disabled = false;
            finishBtn.disabled = false;
            replayBtn.disabled = true;

            replayOutput.textContent = "";
            replayStatus.textContent = "Ready";

            charactersEl.textContent = "0";
            eventCountEl.textContent = "0";
            timeEl.textContent = "0.00s";

            isTyping = true;

            startBtn.disabled = true;

            input.focus();

            /*
             * Update timer every 50ms.
             */
            timer = setInterval(() => {
               const elapsed = performance.now() - session.startedAt;

               timeEl.textContent = (elapsed / 1000).toFixed(2) + "s";
            }, 50);
         });

         /*
        |--------------------------------------------------------------------------
        | RECORD KEY EVENTS
        |--------------------------------------------------------------------------
        */

         input.addEventListener("keydown", (event) => {
            if (!isTyping) return;

            /*
             * Relative timestamp.
             *
             * Example:
             *
             * 100ms -> "T"
             * 240ms -> "h"
             * 390ms -> "e"
             */
            const timestamp = Math.round(performance.now() - session.startedAt);

            /*
             * Ignore modifier keys.
             */
            if (
               event.key === "Shift" ||
               event.key === "Control" ||
               event.key === "Alt" ||
               event.key === "Meta"
            ) {
               return;
            }

            /*
             * Prevent browser shortcuts / unwanted behaviour.
             */
            if (event.key === "Tab") {
               event.preventDefault();
            }

            /*
             * Store the actual keyboard event.
             */
            session.events.push({
               type: "keydown",
               key: event.key,
               t: timestamp,
            });

            eventCountEl.textContent = session.events.length;
         });

         /*
        |--------------------------------------------------------------------------
        | UPDATE CHARACTER COUNT
        |--------------------------------------------------------------------------
        */

         input.addEventListener("input", () => {
            charactersEl.textContent = input.value.length;

            /*
             * Automatically finish when the target
             * text has been completely typed.
             */
            if (input.value === TARGET) {
               finishTest();
            }
         });

         /*
        |--------------------------------------------------------------------------
        | FINISH TEST
        |--------------------------------------------------------------------------
        */

         finishBtn.addEventListener("click", finishTest);

         function finishTest() {
            if (!isTyping) return;

            isTyping = false;

            session.finishedAt = performance.now();

            clearInterval(timer);

            input.disabled = true;
            finishBtn.disabled = true;
            startBtn.disabled = false;

            /*
             * We have a valid event recording.
             */
            replayBtn.disabled = session.events.length === 0;

            replayStatus.textContent = "Session recorded";

            console.log("Typing session:", session);
         }

         /*
        |--------------------------------------------------------------------------
        | REPLAY
        |--------------------------------------------------------------------------
        */

         replayBtn.addEventListener("click", async () => {
            if (!session.events.length) return;

            replayBtn.disabled = true;
            startBtn.disabled = true;

            replayOutput.textContent = "";

            replayStatus.textContent = "Playing...";

            let previousTime = 0;
            let output = "";

            for (const event of session.events) {
               /*
                * Calculate how long the user waited
                * before this key.
                */
               const delay = event.t - previousTime;

               previousTime = event.t;

               /*
                * Reproduce the original pause.
                */
               await sleep(delay);

               /*
                * Reproduce the keyboard action.
                */
               if (event.key === "Backspace") {
                  output = output.slice(0, -1);
               } else if (event.key === "Enter") {
                  output += "\n";
               } else if (event.key.length === 1) {
                  output += event.key;
               }

               /*
                * Update replay screen.
                */
               replayOutput.textContent = output;
            }

            replayStatus.textContent = "Replay finished";

            replayBtn.disabled = false;
            startBtn.disabled = false;
         });

         /*
        |--------------------------------------------------------------------------
        | SLEEP HELPER
        |--------------------------------------------------------------------------
        */

         function sleep(ms) {
            return new Promise((resolve) => {
               setTimeout(resolve, ms);
            });
         }
      </script>
   </body>
</html>

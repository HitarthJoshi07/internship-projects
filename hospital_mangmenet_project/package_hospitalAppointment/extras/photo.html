<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modern Camera Gallery</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<style>
body{
    background:#0f172a;
}
</style>

</head>
<body class="min-h-screen text-white">

<div class="max-w-7xl mx-auto p-8">

    <h1 class="text-4xl font-bold text-center mb-2">
        📸 Camera Gallery
    </h1>

    <p class="text-center text-gray-400 mb-10">
        Capture memories instantly
    </p>

<div class="grid lg:grid-cols-2 gap-10">

<!---------------- LEFT ---------------->

<div>

<div class="rounded-3xl overflow-hidden bg-gray-900 shadow-2xl border border-gray-700">

<video
id="video"
autoplay
playsinline
class="w-full aspect-video object-cover -scale-x-100">
</video>

</div>

<div class="flex gap-4 mt-6">

<button
id="capture"
class="flex-1 bg-green-500 hover:bg-green-600 transition rounded-xl py-4 font-bold text-lg">

📷 Capture

</button>

</div>

</div>

<!--------------- RIGHT ---------------->

<div>

<h2 class="text-2xl font-semibold mb-5">

Gallery

</h2>

<div
id="gallery"
class="grid grid-cols-2 md:grid-cols-3 gap-4">

</div>

</div>

</div>

</div>

<canvas id="canvas" class="hidden"></canvas>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const gallery=document.getElementById("gallery");

navigator.mediaDevices.getUserMedia({

video:{
facingMode:"user"
}

})

.then(stream=>{

video.srcObject=stream;

})

.catch(err=>{

alert("Camera Permission Denied");

});


document.getElementById("capture").onclick=()=>{

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext("2d");

ctx.save();

/* Flip canvas back so saved image is normal */

ctx.translate(canvas.width,0);
ctx.scale(-1,1);

ctx.drawImage(video,0,0);

ctx.restore();

const imgData=canvas.toDataURL("image/png");

createCard(imgData);

}


function createCard(src){

const card=document.createElement("div");

card.className="relative group rounded-2xl overflow-hidden bg-gray-900 shadow-lg";

const img=document.createElement("img");

img.src=src;

img.className="w-full h-52 object-cover";

const overlay=document.createElement("div");

overlay.className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition flex justify-center items-center gap-3";

const download=document.createElement("a");

download.href=src;

download.download="capture.png";

download.innerHTML="⬇️";

download.className="bg-green-500 p-3 rounded-full hover:scale-110 transition";

const del=document.createElement("button");

del.innerHTML="🗑️";

del.className="bg-red-500 p-3 rounded-full hover:scale-110 transition";

del.onclick=()=>{

card.remove();

}

overlay.append(download,del);

card.append(img,overlay);

gallery.prepend(card);

}

</script>

</body>
</html>

                </select>
            </div>

            </div>

                    <button id="weekLabelBtn"

                </button>

                    <div class="w-7 h-7 rounded-full bg-brand-100 flex items-center justify-center">

            </div>
        </div>
</header>

        function getMonday(date) {
            const d = new Date(date);
            const day = d.getDay();
            d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
            return d;
        }

        function getDoctorDaySchedule(doctor, selectedDate) {
            if (!doctor || !selectedDate) {
                return null;
            }

            const date = new Date(`${selectedDate}T00:00:00`);

            const dayName = date.toLocaleDateString("en-US", {
                weekday: "long"
            });

            console.log("Checking doctor:", doctor.doctorName);
            console.log("Selected day:", dayName);
            console.log("Doctor schedule:", doctor.schedule);

            const schedule = Array.isArray(doctor.schedule)
                ? doctor.schedule
                : [];

            const daySchedule = schedule.find(item => {
                const scheduleDay = String(
                    item.day ??
                    item.dayName ??
                    item.weekday ??
                    ""
                )
                    .trim()
                    .toLowerCase();

                return scheduleDay === dayName.toLowerCase();
            });

            console.log("Matched day schedule:", daySchedule);

            return daySchedule || null;
        }

        function getScheduleTiming(daySchedule) {
            if (!daySchedule) {
                return null;
            }

            const startTime =
                daySchedule.timing?.startTime ??
                daySchedule.startTime ??
                daySchedule.from ??
                "";

            const endTime =
                daySchedule.timing?.endTime ??
                daySchedule.endTime ??
                daySchedule.to ??
                "";

            return {
                startTime,
                endTime
            };
        }

        function showNotification(type, message) {
            const notification = document.getElementById("customNotification");
            const content = document.getElementById("notificationContent");
            const icon = document.getElementById("notificationIcon");
            const title = document.getElementById("notificationTitle");
            const messageText = document.getElementById("notificationMessage");

            notification.classList.remove("hidden");

            if (type === "success") {
                content.className = "p-4 text-white bg-gradient-to-r from-blue-600 to-cyan-500";
                icon.innerHTML = `<i class="fas fa-check"></i>`;
                title.textContent = "Assignment Successful";
            }

            if (type === "delete") {
                content.className = "p-4 text-white bg-gradient-to-r from-red-600 to-rose-500";
                icon.innerHTML = `<i class="fas fa-trash"></i>`;
                title.textContent = "Assignment Deleted";
            }
            if (type === "warning") {
                content.className = "p-4 text-white bg-gradient-to-r from-red-600 to-blue-500";
                icon.innerHTML = `<i class="fas fa-calendar-xmark"></i>`;
                title.textContent = "Doctor Not Available";
            }

            messageText.textContent = message;

            clearTimeout(window.notificationTimer);

            window.notificationTimer = setTimeout(() => {
                notification.classList.add("hidden");
            }, 3000);
        }

        function renderWeek() {
            const selectedHospitalId = document.getElementById("headerHospital").value;
            const selectedDepartmentId = document.getElementById("headerDepartment").value;
            const assignments = JSON.parse(localStorage.getItem("DoctorAssignments") || "[]");

            let html = "";

            for (let i = 0; i < 7; i++) {
                const date = new Date(currentMonday);
                const today = new Date();

                date.setDate(currentMonday.getDate() + i);

                const isToday =
                    date.getDate() === today.getDate() &&
                    date.getMonth() === today.getMonth() &&
                    date.getFullYear() === today.getFullYear();

                const dayName = DAYS[i];
                const dayNumber = date.getDate();
                const month = date.toLocaleString("default", { month: "short" });

                const dateString =
                    `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;

                html += `
            <div class="w-[280px] flex flex-col px-2 space-y-3 py-5 rounded-xl">
                <div class="w-full h-16 rounded-xl bg-[#FEFEFE] shadow flex items-center justify-between py-2 px-3 ${isToday ? "border-2 border-blue-500 bg-blue-50/30" : ""}">
                    <div>
                        <h2 class="font-bold text-slate-700">${dayName}</h2>
                        <p class="text-xs text-slate-400">${month} ${dayNumber}</p>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center shadow-md">
                        ${dayNumber}
                    </div>
                </div>

                ${shifts.map(shift => {
                    const shiftAssignments = assignments.filter(assignment => {
                        const hospitalMatch = !selectedHospitalId || String(assignment.hospitalId) === String(selectedHospitalId);
                        const departmentMatch = !selectedDepartmentId || String(assignment.departmentId) === String(selectedDepartmentId);
                        const dateMatch = assignment.date === dateString;
                        const shiftMatch = String(assignment.shift).trim().toLowerCase() === String(shift.name).trim().toLowerCase();

                        return hospitalMatch && departmentMatch && dateMatch && shiftMatch;
                    });

                    return `
                        <div class="bg-[#FFFFFF] rounded-lg cursor-pointer hover:shadow">
                            <div class="text-xs font-bold text-slate-700 flex bg-[#F8FBFD] justify-between p-1 px-3 rounded-t-[inherit] border border-b">
                                <span class="gap-0.5">
                                    <i class="fas ${shift.icon}" style="color:${shift.iconColor}"></i>
                                    ${shift.name}
                                </span>
                                <div class="text-[11px] text-slate-500">
                                    ${shift.time}
                                </div>
                            </div>

                            <div class="items-center flex flex-col p-2 w-full rounded-b-[inherit] min-h-[95px] hover:border-blue-400 hover:border">
                                ${shiftAssignments.length
                            ? shiftAssignments.map(assignment => `
                                        <div class="w-full bg-blue-50 border border-blue-200 rounded-lg p-2 mb-1">
                                            <div class="flex items-center justify-between">
                                                <div class="text-[11px] font-bold text-green-800">
                                                    ${assignment.doctorName}
                                                </div>
                                                <i class="fas fa-user-doctor text-[10px] text-green-600"></i>
                                            </div>
                                            <div class="text-[9px] text-slate-500 mt-1">
                                                <i class="fas fa-hospital text-[8px]"></i>
                                                ${assignment.hospitalName}
                                            </div>
                                            <div class="text-[9px] text-slate-500 mt-1">
                                                <i class="fas fa-building text-[8px]"></i>
                                                ${assignment.departmentName}
                                            </div>
                                            <div class="flex items-center gap-1 text-[9px] text-slate-500 mt-1 justify-between">
                                                <div>
                                                    <i class="fas fa-clock text-[8px]"></i>
                                                ${assignment.startTime} - ${assignment.endTime}     
                                                </div>
                                                <div class="flex gap-0.5">
                                                   <button
                                                        type="button"

                                                        class="editAssignmentBtn p-1 hover:bg-blue-100 rounded-sm">
                                                        <i class="fa-solid fa-pen-to-square text-blue-500"></i>
                                                    </button>
                                                    <button
                                                        type="button"
                                                        data-assignment-id="${assignment.id}"
                                                        class="deleteAssignmentBtn hover:bg-red-100 p-1 rounded-sm">
                                                        <i class="fa fa-trash text-red-500" aria-hidden="true"></i>
                                                    </button>

                                                </div>
                                            </div>
                                        </div>
                                    `).join("")
                            : `
                                            <div class="text-center h-20 flex flex-col items-center justify-center">
                                                <i class="fas fa-grip-vertical text-sm mb-1 opacity-40"></i>
                                                <p class="text-[9px] font-medium">Drop here</p>
                                            </div>
                                        `
                        }
                            </div>
                        </div>
                    `;
                }).join("")}
            </div>
        `;
            }

            container.innerHTML = html;

            document.getElementById("weekLabelBtn").innerText =

        }

            currentMonday.setDate(currentMonday.getDate() - 7);
            renderWeek();
        });

            renderWeek();
        });

            renderWeek();

        const AdminData = JSON.parse(localStorage.getItem("AdminData") || "[]")
        let allDoctors = [];

        function prepareDoctors() {

            allDoctors = [];
            AdminData.forEach(hospital => {
                hospital.doctors.forEach(doc => {
                    const dept = hospital.departments.find(
                        d => d.departmentId === doc.departmentId
                    );
                    allDoctors.push({
                        ...doc,
                        hospitalName: hospital.name || "hospital",
                        departmentName: dept ? dept.departmentName : "-"
                    });
                });
            });

        }

</button>

                // ?start aur end ka validiation h bhai 
                if (selectedStartTime >= selectedEndTime) {
                    showNotification("warning", "End time must be greater than start time.");
                    return;
                }


                const selectedDateObject = new Date(`${selectedDate}T00:00:00`);
                const selectedDayName = selectedDateObject.toLocaleDateString("en-US", { weekday: "long" });

                const daySchedule = doctor.schedule?.find(schedule =>
                    String(schedule.day).trim().toLowerCase() === String(selectedDayName).trim().toLowerCase()
                );

                if (!daySchedule) {
                    showNotification("warning", `${doctor.doctorName} is not available on ${selectedDayName}.`);
                    return;
                }

                const availableStart = daySchedule.timing?.startTime;
                const availableEnd = daySchedule.timing?.endTime;

                if (!availableStart || !availableEnd) {
                    showNotification("warning", `${doctor.doctorName} has no working time configured for ${selectedDayName}.`);
                    return;
                }

                if (selectedStartTime < availableStart || selectedEndTime > availableEnd) {
                    showNotification("warning", `${doctor.doctorName} is available only from ${availableStart} to ${availableEnd}.`);
                    return;
                }

                const selectedHospitalData = AdminData.find(hospital =>
                    String(hospital.id) === String(selectedHospital)
                );

                if (!selectedHospitalData) {
                    showNotification("warning", "Selected hospital was not found.");
                    return;

                    String(doc.doctorId) === String(doctorId) &&

                    String(doc.departmentId) === String(selectedDepartment)
                );

                if (!selectedDoctorData) {
                    showNotification("warning", "Doctor is not available in the selected department.");
                    return;
                }

                const assignments = JSON.parse(localStorage.getItem("DoctorAssignments") || "[]");

                function isTimeOverlapping(startA, endA, startB, endB) {
                    return startA < endB && endA > startB;
                }

                const sameDoctorConflict = assignments.find(assignment => {
                    const sameDoctor = String(assignment.doctorId) === String(doctorId);
                    const sameDate = assignment.date === selectedDate;

                    if (!sameDoctor || !sameDate) {
                        return false;
                    }

                    return isTimeOverlapping(selectedStartTime, selectedEndTime, assignment.startTime, assignment.endTime);
                });

                if (sameDoctorConflict) {
                    showNotification(
                        "warning",
                        `${doctor.doctorName} is already assigned from ${sameDoctorConflict.startTime} to ${sameDoctorConflict.endTime} on this day.`
                    );
                    return;

                    const differentDoctor = String(assignment.doctorId) !== String(doctorId);

                    if (!sameHospital || !sameDepartment || !sameDate || !differentDoctor) {
                        return false;
                    }

                    return isTimeOverlapping(selectedStartTime, selectedEndTime, assignment.startTime, assignment.endTime);
                });

                if (differentDoctorConflict) {

    `;

    const schedule = Array.isArray(doctor.schedule)

    if (!schedule.length) {
        scheduleDetails.innerHTML = `

                <p class="text-[10px] text-slate-400 mt-1">

                </p>
            </div>
        `;
    } else {
        const orderedDays = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

        scheduleDetails.innerHTML = orderedDays.map(day => {
            const daySchedule = schedule.find(item => {
                const scheduleDay = String( item?.day ?? item?.dayName ?? item?.weekday ?? "").trim().toLowerCase();
                return scheduleDay === day.toLowerCase();
            });

            /*

            const availableValue = daySchedule?.available;

            const endTime =
                daySchedule?.timing?.endTime ??
                daySchedule?.endTime ??
                daySchedule?.to ??
                "";

            if (!isAvailable) {
                return `

                                    No working hours for ${day}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="border border-green-200 rounded-xl p-3 bg-green-50/40">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-lg bg-green-100 flex items-center justify-center">

                        <span class="text-[9px] font-bold px-2 py-1 rounded-full bg-green-100 text-green-600">

                                    ${startTime || "--"}

                        <div class="bg-white border flex items-end gap-2 justify-start border-green-100 rounded-lg p-2">

                    <div class="mt-2 px-2.5 py-2 bg-white rounded-lg border border-green-100">

            `;
        
        }).join("");
    }

        function openEditAssignmentModal(assignment, doctor) {

            modal.classList.add("flex");

            const card = document.createElement("div");

                            for="edit-end-time"
                            class="block text-xs font-semibold text-slate-600 mb-1.5">

                            class="w-full h-9 px-3 text-xs bg-white border border-slate-200 rounded-lg">

                option.textContent = hospital.name;

                editHospital.appendChild(option);

            function loadEditDepartments(hospitalId) {
                editDepartment.innerHTML = "";

                const doctorDepartments = allDoctors.filter(doc =>
                    doc.doctorId === assignment.doctorId &&
                    String(doc.hospitalId) === String(hospitalId)
                );

                doctorDepartments.forEach(doc => {
                    const option = document.createElement("option");
                    option.value = doc.departmentId;
                    option.textContent = doc.departmentName;

                    editDepartment.appendChild(option);
                });

                editDepartment.value = assignment.departmentId;
            }

            loadEditDepartments(assignment.hospitalId);

            editHospital.addEventListener("change", () => {
                loadEditDepartments(editHospital.value);
            });

            editDate.value = assignment.date;
            editStartTime.value = assignment.startTime;
            editEndTime.value = assignment.endTime;
            editShift.value = assignment.shift;

            document.getElementById("cancelEdit").addEventListener("click", () => {
                modal.classList.add("hidden");
                modal.classList.remove("flex");
                modalDialog.innerHTML = "";
            });

            document.getElementById("updateAssignment").addEventListener("click", () => {
                const selectedHospital = editHospital.value;
                const selectedDepartment = editDepartment.value;
                const selectedDate = editDate.value;
                const selectedStartTime = editStartTime.value;
                const selectedEndTime = editEndTime.value;
                const selectedShift = editShift.value;

                if (!selectedHospital || !selectedDepartment || !selectedDate || !selectedStartTime || !selectedEndTime) {
                    alert("Please fill all required fields.");
                    return;
                }

                const selectedHospitalData = AdminData.find(
                    hospital => hospital.id === selectedHospital
                );

                const selectedDoctorData = allDoctors.find(doc =>
                    doc.doctorId === assignment.doctorId &&
                    String(doc.hospitalId) === String(selectedHospital) &&
                    String(doc.departmentId) === String(selectedDepartment)
                );

                const selectedDateObject = new Date(`${selectedDate}T00:00:00`);
                const assignments = JSON.parse(localStorage.getItem("DoctorAssignments") || "[]");
                const index = assignments.findIndex(item => item.id === assignment.id);

                if (index === -1) return;

                assignments[index] = {
                    ...assignments[index],
                    hospitalId: selectedHospital,
                    hospitalName: selectedHospitalData?.name || "",
                    departmentId: selectedDepartment,
                    departmentName: selectedDoctorData?.departmentName || "",
                    date: selectedDate,
                    day: selectedDateObject.toLocaleDateString(
                        "en-US",
                        { weekday: "long" }
                    ),
                    startTime: selectedStartTime,
                    endTime: selectedEndTime,
                    shift: selectedShift
                };

                localStorage.setItem(
                    "DoctorAssignments",
                    JSON.stringify(assignments)
                );

                modal.classList.remove("flex");
                modalDialog.innerHTML = "";

                renderWeek();

                showNotification(
                    "success",
                    `${assignment.doctorName} assignment updated successfully.`
                );
            });
